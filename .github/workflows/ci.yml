name: CPU protocol CI
on: [push, pull_request]
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/
      - run: python -m pytest -q legacy/thuy/branch
      - run: python -m pytest -q legacy/loc/tools/praco_test1/test_verify_praco_artifacts.py
