[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zoc-research"
version = "0.1.0"
description = "Research archive for query-conditioned zero-shot counting"
requires-python = ">=3.10"
dependencies = ["numpy", "pyyaml", "pandas", "scikit-learn", "Pillow"]

[project.optional-dependencies]
test = ["pytest", "scipy"]
gpu = ["torch", "torchvision"]

[tool.pytest.ini_options]
testpaths = ["src/zoc"]
